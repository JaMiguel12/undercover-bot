[project]
name = "undercover-bot"
version = "0.1.0"
description = "Bot Telegram Undercover avec agents IA"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.0,<4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite",
    "pydantic-settings",
    "groq",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bot", "bot.handlers", "game", "ai", "db"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
